name: Workflow security

on:
  pull_request:
    paths:
      - ".github/**"
      - "action.yml"
      - "release.config.mjs"
      - "scripts/check-release-policy.mjs"
      - "scripts/check-workflows.mjs"
      - "scripts/update-major-tag.sh"
      - "package.json"
      - "package-lock.json"
      - "zizmor.yml"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "action.yml"
      - "release.config.mjs"
      - "scripts/check-release-policy.mjs"
      - "scripts/check-workflows.mjs"
      - "scripts/update-major-tag.sh"
      - "package.json"
      - "package-lock.json"
      - "zizmor.yml"

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Pinning and permissions policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.10.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce workflow and release policy
        run: |
          npm run check:workflows
          npm run check:release

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false
          annotations: true
          config: zizmor.yml
          online-audits: false
